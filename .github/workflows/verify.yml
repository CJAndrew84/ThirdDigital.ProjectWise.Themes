name: Verify source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository-checks:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository files
        shell: pwsh
        run: ./build/Check-Repository.ps1
  unit-and-harness-build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Run unit tests without the proprietary SDK
        shell: pwsh
        run: ./AtkinsRealis.ProjectWise.Themes.Harness/Verify.ps1 -Suite Unit -Configuration Release -ResultsRoot "$env:RUNNER_TEMP/verification"
      - name: Compile native regression harnesses
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $msbuild = & $vswhere -version '[17.0,18.0)' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          & $msbuild AtkinsRealis.ProjectWise.Themes.sln -t:AtkinsRealis_ProjectWise_Themes_Harness -p:Configuration=Release -p:Platform=x86 -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  quickaccess-checks:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Quick Access checks without the proprietary SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $msbuild = & $vswhere -version '[17.0,18.0)' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          & $msbuild ./ThirdDigital.ProjectWise.QuickAccess/Checks/AtkinsRealis.ProjectWise.QuickAccess.Checks.vcxproj -t:Build -p:Configuration=Release -p:Platform=Win32 -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native keyboard, accessibility, layout and icon checks
        shell: pwsh
        run: |
          & ./ThirdDigital.ProjectWise.QuickAccess/Checks/out/Win32/Release/bin/AtkinsRealis.ProjectWise.QuickAccess.Checks.exe --preview "$env:RUNNER_TEMP/QuickAccess-icons.bmp" --workflow-preview "$env:RUNNER_TEMP/QuickAccess-workflow.bmp" --view-preview "$env:RUNNER_TEMP/QuickAccess-view.bmp" --selectors-preview "$env:RUNNER_TEMP/QuickAccess-selectors.bmp"
          $checksResult = $LASTEXITCODE
          Add-Type -AssemblyName System.Drawing
          foreach ($image in Get-ChildItem "$env:RUNNER_TEMP/QuickAccess-*.bmp") {
            $preview = [System.Drawing.Image]::FromFile($image.FullName)
            try { $preview.Save([System.IO.Path]::ChangeExtension($image.FullName, '.png'), [System.Drawing.Imaging.ImageFormat]::Png) }
            finally { $preview.Dispose() }
          }
          exit $checksResult
      - name: Keep the native command icon preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quickaccess-icons
          path: ${{ runner.temp }}/QuickAccess-*.png
          retention-days: 14
          if-no-files-found: warn
